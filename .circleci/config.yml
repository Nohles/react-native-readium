version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  javascript:
    docker:
      - image: cimg/node:22.19
    working_directory: ~/project

commands:
  install_dependencies:
    steps:
      - restore_cache:
          keys:
            - yarn-v2-{{ arch }}-{{ checksum "yarn.lock" }}
            - yarn-v2-{{ arch }}-
      - run:
          name: Install workspace dependencies
          command: yarn install --frozen-lockfile
      - save_cache:
          key: yarn-v2-{{ arch }}-{{ checksum "yarn.lock" }}
          paths:
            - ~/.cache/yarn

jobs:
  javascript:
    executor: javascript
    steps:
      - checkout
      - install_dependencies
      - run:
          name: Lint
          command: yarn lint
      - run:
          name: Typecheck
          command: |
            yarn typescript
            yarn tsc --noEmit -p apps/example-native/tsconfig.json
            yarn tsc --noEmit -p apps/example-expo/tsconfig.json
      - run:
          name: Unit tests
          command: yarn test --coverage --runInBand
      - run:
          name: Build package
          command: yarn prepare
      - store_artifacts:
          path: coverage
          destination: coverage

  android-examples:
    machine:
      image: android:2026.05.1
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout
      - node/install:
          node-version: '22.19.0'
          install-yarn: true
      - run:
          name: Initialize Kotlin toolkit fork
          command: git submodule update --init --depth 1 external/kotlin-toolkit
      - install_dependencies
      - restore_cache:
          keys:
            - kotlin-toolkit-v2-{{ checksum ".gitmodules" }}-{{ checksum "external/kotlin-toolkit/gradle/libs.versions.toml" }}
            - kotlin-toolkit-v2-
      - run:
          name: Publish Kotlin toolkit fork locally
          command: SKIP_SIGNING=1 ./scripts/publish-kotlin-toolkit-maven-local.sh --no-daemon
      - save_cache:
          key: kotlin-toolkit-v2-{{ checksum ".gitmodules" }}-{{ checksum "external/kotlin-toolkit/gradle/libs.versions.toml" }}
          paths:
            - ~/.m2/repository/org/readium
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Build native Android example
          command: cd apps/example-native/android && ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
      - run:
          name: Generate Expo Android project
          command: yarn workspace example-expo prebuild --platform android --no-install
      - run:
          name: Build Expo Android example
          command: cd apps/example-expo/android && ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=x86_64
      - store_artifacts:
          path: apps/example-native/android/app/build/outputs/apk/debug/app-debug.apk
          destination: example-native-debug.apk
      - store_artifacts:
          path: apps/example-expo/android/app/build/outputs/apk/debug/app-debug.apk
          destination: example-expo-debug.apk

workflows:
  build-and-test:
    jobs:
      - javascript
      - android-examples
