buildscript {
  // Pinned: the toolkit 3.3.0 artifacts carry Kotlin 2.3 metadata, so this
  // library must compile with Kotlin >= 2.3 regardless of the host app's
  // kotlinVersion override (hosts overriding lower will fail their own
  // compilation of app code that reads these classes).
  def kotlin_version = project.properties['Readium_kotlinVersion']
  // Consumed as a source dependency (composite build) when the host app
  // wires `includeBuild` against external/kotlin-toolkit; this Maven
  // coordinate is the fallback for hosts that do not substitute.
  ext.readium_version = '3.3.0'

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.5.0'
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['Readium_' + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['Readium_' + name]).toInteger()
}

def reactNativeArchitectures() {
  def architectures = project.properties['reactNativeArchitectures']
  return architectures
    ? architectures.split(',')
    : ['x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a']
}

android {
  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')
  namespace "com.reactnativereadium"
  defaultConfig {
    minSdkVersion 24
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
    versionCode 1
    versionName "1.0"

    externalNativeBuild {
      cmake {
        cppFlags "-O2 -frtti -fexceptions -Wall -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lint {
    disable 'GradleCompatible'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = "17"
  }

  buildFeatures {
    viewBinding true
    prefab true
  }

  sourceSets {
    main {
      java.srcDirs += ["${project.projectDir}/../nitrogen/generated/android/kotlin"]
    }
  }
}

repositories {
  // locally-published Nohles/kotlin-toolkit artifacts win over Maven
  // Central (see scripts/publish-kotlin-toolkit-maven-local.sh)
  mavenLocal()
  mavenCentral()
  google()
  // required by readium's pdfium adapter, which pulls com.github.marain87:*
  maven { url "https://jitpack.io" }

  def found = false
  def defaultDir = null
  def androidSourcesName = 'React Native sources'

  if (rootProject.ext.has('reactNativeAndroidRoot')) {
    defaultDir = rootProject.ext.get('reactNativeAndroidRoot')
  } else {
    defaultDir = new File(
            projectDir,
            '/../../../node_modules/react-native/android'
    )
  }

  if (defaultDir.exists()) {
    maven {
      url defaultDir.toString()
      name androidSourcesName
    }

    logger.info(":${project.name}:reactNativeAndroidRoot ${defaultDir.canonicalPath}")
    found = true
  } else {
    def parentDir = rootProject.projectDir

    1.upto(5, {
      if (found) return true
      parentDir = parentDir.parentFile

      def androidSourcesDir = new File(
              parentDir,
              'node_modules/react-native'
      )

      def androidPrebuiltBinaryDir = new File(
              parentDir,
              'node_modules/react-native/android'
      )

      if (androidPrebuiltBinaryDir.exists()) {
        maven {
          url androidPrebuiltBinaryDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidPrebuiltBinaryDir.canonicalPath}")
        found = true
      } else if (androidSourcesDir.exists()) {
        maven {
          url androidSourcesDir.toString()
          name androidSourcesName
        }

        logger.info(":${project.name}:reactNativeAndroidRoot ${androidSourcesDir.canonicalPath}")
        found = true
      }
    })
  }

  if (!found) {
    throw new GradleException(
            "${project.name}: unable to locate React Native android sources. " +
                    "Ensure you have you installed React Native as a dependency in your project and try again."
    )
  }
}

// same pin as the buildscript: stdlib must match the compiler version
def kotlin_version = project.properties['Readium_kotlinVersion']

dependencies {
  // noinspection GradleDynamicVersion
  api "com.facebook.react:react-native:+"
  implementation project(':react-native-nitro-modules')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // readium deps
  implementation "org.readium.kotlin-toolkit:readium-shared:$readium_version"
  implementation "org.readium.kotlin-toolkit:readium-streamer:$readium_version"
  implementation "org.readium.kotlin-toolkit:readium-navigator:$readium_version"
  // audiobook playback: AudioNavigator is Media3-based and lives outside
  // readium-navigator; the ExoPlayer adapter provides the playback engine.
  implementation "org.readium.kotlin-toolkit:readium-navigator-media-audio:$readium_version"
  implementation "org.readium.kotlin-toolkit:readium-adapter-exoplayer-audio:$readium_version"
  implementation "org.readium.kotlin-toolkit:readium-adapter-pdfium-navigator:$readium_version"
  implementation "org.readium.kotlin-toolkit:readium-adapter-pdfium-document:$readium_version"

  // other deps
  // Only what the reader actually uses. The earlier list carried Room, jsoup,
  // Picasso, joda-time, Timber and the whole navigation/paging/recyclerview/
  // viewpager2/webkit/material/cardview/browser stack, none of which appear in a
  // single source file — they were inherited from a Readium 2 example app and
  // silently shipped into every consumer's APK.
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "androidx.activity:activity-ktx:1.9.0"
  implementation "androidx.appcompat:appcompat:1.6.1"
  implementation "androidx.constraintlayout:constraintlayout:2.1.4"
  implementation "androidx.fragment:fragment-ktx:1.7.1"
  implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.8.4"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
  implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4"
  // media3 session is required by our AudiobookMediaService (lock-screen /
  // background playback controls); the toolkit marks it `implementation`, so
  // declare it explicitly. Version must match the toolkit's pin.
  implementation "androidx.media3:media3-session:1.10.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"

  testImplementation "org.jetbrains.kotlin:kotlin-test-junit:$kotlin_version"
  testImplementation "junit:junit:4.13.2"

  androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
  androidTestImplementation "androidx.test:runner:1.5.2"
}
